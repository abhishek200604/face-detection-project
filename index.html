<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Count Detection</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light-theme text-dark">
    <div class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-8 col-lg-6">
                <!-- Main Application Card -->
                <div class="card premium-card border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <header class="text-center mb-4">
                            <div class="mb-3 d-inline-flex align-items-center justify-content-center icon-container bg-primary-subtle text-primary rounded-circle" style="width: 56px; height: 56px;">
                                <i class="bi bi-person-bounding-box fs-3"></i>
                            </div>
                            <h1 class="fw-bold mb-2 text-dark">Face Detection</h1>
                            <p class="text-muted">Upload an image to detect the number of faces using AI.</p>
                        </header>
                        
                        <main>
                            <!-- Uploading Area -->
                            <div class="upload-area mb-4 rounded-4" id="uploadArea">
                                <input type="file" id="fileInput" accept="image/jpeg, image/jpg, image/png" hidden>
                                <div class="upload-content text-center" id="uploadContent">
                                    <div class="mb-3 text-primary" style="opacity: 0.8;">
                                        <i class="bi bi-cloud-arrow-up display-4"></i>
                                    </div>
                                    <p class="upload-text mb-1 fw-bold fs-5 text-dark">Drop your image here</p>
                                    <p class="upload-hint text-muted small mb-3">Supports JPG, JPEG, PNG</p>
                                    <span class="btn btn-sm btn-light border rounded-pill px-4 fw-semibold shadow-sm text-dark">Browse files</span>
                                </div>
                                <img id="imagePreview" class="image-preview img-fluid rounded-4 shadow-sm" alt="Image preview" hidden>
                            </div>

                            <!-- Actions -->
                            <div class="actions d-grid gap-3">
                                <button id="detectButton" class="btn btn-primary btn-lg custom-btn-primary rounded-pill d-flex justify-content-center align-items-center gap-2 fw-semibold" disabled>
                                    <i class="bi bi-search btn-icon"></i>
                                    <span class="btn-text">Detect Faces</span>
                                    <div class="spinner-border spinner-border-sm" role="status" id="spinner" hidden>
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </button>
                                <button id="resetButton" class="btn btn-light btn-lg custom-btn-secondary rounded-pill fw-medium text-muted" hidden>
                                    <i class="bi bi-arrow-counterclockwise me-2"></i>Try Another Image
                                </button>
                            </div>

                            <!-- Results Section -->
                            <div id="resultContainer" class="result-container mt-5 p-0" hidden>
                                <div class="text-center mb-4">
                                    <div class="badge bg-success-subtle text-success rounded-pill px-3 py-2 mb-3 fw-semibold border border-success-subtle">
                                        <i class="bi bi-check-circle-fill me-1"></i> Analysis complete
                                    </div>
                                    <h2 class="display-1 fw-bold text-dark mb-0 lh-1" id="faceCount">0</h2>
                                    <p class="text-muted fw-bold text-uppercase tracking-wide mt-2 mb-0" style="font-size: 0.85rem;">Faces Detected</p>
                                </div>
                                
                                <div class="statement-card bg-light rounded-4 p-4 text-center mb-4 border border-light-subtle">
                                    <p id="statementText" class="fs-5 fw-medium text-dark mb-0"></p>
                                </div>
                                
                                <div id="audioContainer" class="audio-card border border-light-subtle rounded-4 p-4" hidden>
                                    <div class="d-flex align-items-center gap-3 mb-3">
                                        <div class="icon-box bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                            <i class="bi bi-soundwave fs-5"></i>
                                        </div>
                                        <div>
                                            <h6 class="mb-0 fw-bold text-dark">AI Voice Result</h6>
                                            <small class="text-muted fw-medium">Listen to the detection result</small>
                                        </div>
                                    </div>
                                    <audio id="audioPlayer" controls class="w-100 custom-native-audio"></audio>
                                </div>
                            </div>

                            <!-- Errors -->
                            <div id="errorContainer" class="alert alert-danger mt-4 d-flex align-items-center gap-3 border-0 rounded-4 shadow-sm" role="alert" hidden>
                                <i class="bi bi-exclamation-triangle-fill fs-4 text-danger"></i>
                                <p id="errorMessage" class="mb-0 fw-medium flex-grow-1 text-danger">An error occurred while processing the image.</p>
                            </div>
                        </main>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
